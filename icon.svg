<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="85%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="ballGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#fef08a"/>
      <stop offset="55%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <radialGradient id="glossGrad" cx="35%" cy="30%" r="40%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.7)"/>
      <stop offset="60%" stop-color="rgba(255,255,255,0.0)"/>
    </radialGradient>
  </defs>

  <!-- Base App Tile -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#f59e0b" stroke-width="4" stroke-opacity="0.5"/>

  <!-- Billiard Table Felt Diamond Inlay -->
  <path d="M256 72 L440 256 L256 440 L72 256 Z" fill="#065f46" stroke="#10b981" stroke-width="3" stroke-dasharray="6,6" opacity="0.4"/>

  <!-- Tapered Maple Cue Stick -->
  <line x1="80" y1="432" x2="380" y2="132" stroke="#d97706" stroke-width="16" stroke-linecap="round"/>
  <line x1="380" y1="132" x2="410" y2="102" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>

  <!-- 9-Ball (Tournament Rotational Ball) -->
  <g transform="translate(256, 256)">
    <!-- White base -->
    <circle r="120" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Yellow Stripe Belt -->
    <clipPath id="ballClip">
      <circle r="120"/>
    </clipPath>
    <rect x="-120" y="-55" width="240" height="110" fill="url(#ballGrad)" clip-path="url(#ballClip)"/>
    
    <!-- Specular Highlight -->
    <circle r="120" fill="url(#glossGrad)"/>
    
    <!-- White Number Badge -->
    <circle cx="0" cy="0" r="45" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" text-anchor="middle" fill="#0f172a">9</text>
    <line x1="-18" y1="26" x2="18" y2="26" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>

name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Dependencies & Build Web Bundle
        working-directory: ./web-client
        run: |
          npm ci
          npm run build

      - name: Sync Capacitor Android Project
        working-directory: ./web-client
        run: |
          npx cap sync android

      - name: Assemble Debug APK
        working-directory: ./web-client/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Rename & Prepare APK Artifact
        run: |
          mkdir -p release-artifacts
          cp web-client/android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/PuddinsPool.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PuddinsPool-Android-APK
          path: release-artifacts/PuddinsPool.apk

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: "Puddin's Pool ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          files: release-artifacts/PuddinsPool.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
